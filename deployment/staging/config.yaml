environment: staging
model:
  base: mlx-community/Llama-3.2-3B-Instruct-4bit
  adapter_path: ./adapters/llama
  max_tokens: 256

server:
  host: 0.0.0.0
  port: 7860
  workers: 1

rag:
  enabled: true
  knowledge_file: ./data/processed/train_book_content.jsonl
  top_k: 2

guardrails:
  enabled: true
  strict_mode: false

logging:
  level: debug
  file: logs/staging.log

features:
  chat_history: false
  metrics_dashboard: false
  rls_protection: false