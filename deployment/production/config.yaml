environment: production
model:
  base: mlx-community/Llama-3.2-3B-Instruct-4bit
  adapter_path: ./adapters/llama
  max_tokens: 256
  cache_models: true

server:
  host: 0.0.0.0
  port: 7860
  workers: 2

rag:
  enabled: true
  knowledge_file: ./data/processed/train_book_content.jsonl
  top_k: 2

guardrails:
  enabled: true
  strict_mode: true
  log_all_requests: true

logging:
  level: info
  file: logs/production.log

features:
  chat_history: true
  metrics_dashboard: true
  rls_protection: true

health_check:
  enabled: true
  interval_seconds: 60
  endpoint: /health

monitoring:
  metrics_enabled: true
  alert_on_errors: true