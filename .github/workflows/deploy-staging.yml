name: Deploy Staging

on:
  push:
    branches: [develop]

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          architecture: arm64

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify model exists
        run: |
          if [ ! -d "adapters/v1" ]; then
            echo "⚠️  No trained model found in adapters/v1/"
            echo "   Staging will run with base model only"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: staging-app
          path: |
            scripts/
            app.py
            requirements.txt

      - name: Report status
        run: |
          echo "✅ Staging deploy ready"
          echo "📝 To run locally: python app.py"
          echo "🌐 Access: http://localhost:7860"